services:
  postgres:
    image: ghcr.io/pgmq/pg16-pgmq:latest
    container_name: newswatch-postgres
    environment:
      POSTGRES_USER: newswatch
      POSTGRES_PASSWORD: newswatch
      POSTGRES_DB: newswatch
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newswatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: newswatch-redis
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local S3-compatible storage to stand in for Cloudflare R2 in dev.
  minio:
    image: quay.io/minio/minio:latest
    container_name: newswatch-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  createbucket:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin) do echo 'waiting for minio'; sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/newswatch-media;
      /usr/bin/mc anonymous set download local/newswatch-media;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
