<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NewsWatch — Edit Profile</title>
<link rel="stylesheet" href="shared/app.css" />
</head>
<body data-page="profile" data-app="true">
<div class="page-wrap">
  <div class="page" style="max-width:560px">
    <a href="p18-profile.html" class="small" style="color:var(--muted)">&larr; Back to profile</a>
    <h1 class="page-title mt-2">Edit profile</h1>
    <p class="page-sub">Update your public details.</p>

    <div class="card card-pad">
      <div class="row mb-3">
        <span class="avatar avatar-lg">A</span>
        <div><button class="btn btn-secondary btn-sm" onclick="owFilePicker('image/*')">Change photo</button><div class="small muted mt-1">JPG or PNG, up to 5MB.</div></div>
      </div>
      <form onsubmit="return owSubmit(event)">
        <div class="field"><label>Full name</label><input class="input" value="Aarav Sharma" /></div>
        <div class="field"><label>Username</label><input class="input" value="aarav" /></div>
        <div class="field"><label>Bio</label><textarea class="textarea" placeholder="Tell readers about you">Avid reader, cricket fan.</textarea></div>
        <div class="field"><label>Email</label><input class="input" type="email" value="aarav@example.com" /></div>
        <div class="field"><label>Phone</label><input class="input" value="+91 98765 43210" /><div class="hint">Changing this requires OTP verification.</div></div>
        <button class="btn btn-primary" type="submit">Save changes</button>
      </form>
    </div>
  </div>
</div>
<script src="shared/app.js"></script>
</body>
</html>
