<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NewsWatch — Sign Up</title>
<link rel="stylesheet" href="shared/app.css" />
</head>
<body data-chrome="none">
<div class="auth-wrap">
  <div class="auth-side">
    <span class="logo-icon" style="background:#fff"></span>
    <h2 class="mt-3">Create your<br />account</h2>
    <p>Join thousands of readers. Free forever — no subscription required.</p>
  </div>
  <div class="auth-main">
    <div class="auth-card">
      <a href="p03-login.html" class="small" style="color:var(--muted)">&larr; Back to login</a>
      <h1 class="mt-2">Sign up</h1>
      <p class="lead">It only takes a minute.</p>

      <form onsubmit="return owSubmit(event)">
        <div class="field">
          <label>Full name</label>
          <input class="input" type="text" placeholder="Your name" />
        </div>
        <div class="field">
          <label>Email address</label>
          <input class="input" type="email" placeholder="you@example.com" />
        </div>
        <div class="field">
          <label>Phone number</label>
          <input class="input" type="tel" placeholder="+91 00000 00000" />
        </div>
        <div class="field">
          <label>Password</label>
          <input class="input" type="password" placeholder="Minimum 8 characters" />
          <div class="hint">Use letters, numbers and a symbol.</div>
        </div>
        <label class="small row mb-2" style="gap:7px;align-items:flex-start">
          <input type="checkbox" style="margin-top:3px" />
          <span>I agree to the <a href="p21-about-static.html" style="color:var(--purple)">Terms</a> and <a href="p21-about-static.html" style="color:var(--purple)">Privacy Policy</a>.</span>
        </label>
        <button class="btn btn-primary btn-block" type="submit">Create account</button>
      </form>

      <p class="center mt-3 small">Already registered? <a href="p03-login.html" style="color:var(--purple);font-weight:700">Log in</a></p>
    </div>
  </div>
</div>
<script src="shared/app.js"></script>
</body>
</html>
