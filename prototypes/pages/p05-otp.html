<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NewsWatch — Verify OTP</title>
<link rel="stylesheet" href="shared/app.css" />
<style>
  .otp-row { display:flex; gap:10px; justify-content:space-between; margin:20px 0; }
  .otp-row input { width:100%; height:54px; text-align:center; font-size:22px; font-weight:700; border:1px solid var(--border); border-radius:var(--radius-md); outline:none; }
  .otp-row input:focus { border-color:var(--purple); box-shadow:0 0 0 3px var(--purple-light); }
</style>
</head>
<body data-chrome="none">
<div class="auth-wrap">
  <div class="auth-side">
    <span class="logo-icon" style="background:#fff"></span>
    <h2 class="mt-3">Almost there</h2>
    <p>We sent a 6-digit code to verify it's really you.</p>
  </div>
  <div class="auth-main">
    <div class="auth-card">
      <a href="p04-signup.html" class="small" style="color:var(--muted)">&larr; Back</a>
      <h1 class="mt-2">Verify your phone</h1>
      <p class="lead">Enter the code sent to <b>+91 98765 43210</b>.</p>
      <div class="otp-row">
        <input maxlength="1" inputmode="numeric" /><input maxlength="1" inputmode="numeric" />
        <input maxlength="1" inputmode="numeric" /><input maxlength="1" inputmode="numeric" />
        <input maxlength="1" inputmode="numeric" /><input maxlength="1" inputmode="numeric" />
      </div>
      <button class="btn btn-primary btn-block" onclick="owSubmit(event)">Verify &amp; continue</button>
      <p class="center mt-2 small muted">Resend code in <b>00:28</b></p>
      <p class="center small"><a href="p03-login.html" style="color:var(--purple);font-weight:700">Change number</a></p>
    </div>
  </div>
</div>
<script src="shared/app.js"></script>
<script>
  var boxes = document.querySelectorAll(".otp-row input");
  boxes.forEach(function (b, i) {
    b.addEventListener("input", function () { if (b.value && boxes[i+1]) boxes[i+1].focus(); });
    b.addEventListener("keydown", function (e) { if (e.key === "Backspace" && !b.value && boxes[i-1]) boxes[i-1].focus(); });
  });
</script>
</body>
</html>
