<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NewsWatch — Reset Password</title>
<link rel="stylesheet" href="shared/app.css" />
</head>
<body data-chrome="none">
<div class="auth-wrap">
  <div class="auth-side">
    <span class="logo-icon" style="background:#fff"></span>
    <h2 class="mt-3">Reset your<br />password</h2>
    <p>We'll email you a secure link to set a new password.</p>
  </div>
  <div class="auth-main">
    <div class="auth-card">
      <a href="p03-login.html" class="small" style="color:var(--muted)">&larr; Back to login</a>
      <h1 class="mt-2">Forgot password?</h1>
      <p class="lead">Enter your email and we'll send a reset link.</p>
      <form onsubmit="return owSubmit(event)">
        <div class="field">
          <label>Email address</label>
          <input class="input" type="email" placeholder="you@example.com" />
        </div>
        <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
      </form>
      <div class="toast-note mt-3">Check your inbox. The link expires in 30 minutes.</div>
    </div>
  </div>
</div>
<script src="shared/app.js"></script>
</body>
</html>
