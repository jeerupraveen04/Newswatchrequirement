<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NewsWatch — Profile</title>
<link rel="stylesheet" href="shared/app.css" />
</head>
<body data-page="profile" data-app="true">
<div class="page-wrap">
  <div class="page">
    <div class="card card-pad">
      <div class="row">
        <span class="avatar avatar-lg">A</span>
        <div class="grow">
          <h1 style="font-size:22px;font-weight:800">Aarav Sharma</h1>
          <div class="muted small">@aarav &middot; Reader</div>
          <div class="row mt-1">
            <a class="btn btn-secondary btn-sm" href="p19-edit-profile.html">Edit profile</a>
            <a class="btn btn-ghost btn-sm" href="p20-settings.html">Settings</a>
          </div>
        </div>
      </div>
      <div class="grid grid-3 mt-3">
        <div class="kpi"><div class="num">24</div><div class="lbl">Saved</div></div>
        <div class="kpi"><div class="num">81</div><div class="lbl">Likes given</div></div>
        <div class="kpi"><div class="num">16</div><div class="lbl">Comments</div></div>
      </div>
    </div>

    <div class="row mt-3 mb-2">
      <button class="chip active">Saved</button>
      <button class="chip">Comments</button>
      <button class="chip">Liked</button>
    </div>
    <article class="list-row">
      <img class="thumb" src="https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?auto=format&fit=crop&w=500&q=80" alt="" />
      <div class="grow"><a href="p09-article-detail.html"><div class="title">PM Modi Inaugurates New Infrastructure Projects</div></a><div class="sub">India &middot; saved 2h ago</div></div>
    </article>

    <div class="card card-pad mt-3">
      <div class="row-between">
        <div><b>Become a reporter</b><div class="small muted">Contribute stories to NewsWatch.</div></div>
        <a class="btn btn-primary btn-sm" href="p21-about-static.html">Apply</a>
      </div>
    </div>

    <div class="toast-note mt-3">Reporters see the <a href="r01-reporter-dashboard.html" style="color:var(--purple);font-weight:700">Reporter Dashboard</a> here.</div>
  </div>
</div>
<script src="shared/app.js"></script>
</body>
</html>
